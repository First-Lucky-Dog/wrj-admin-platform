<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>验收测试记录摘录</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 960px; min-height: 620px; background: #eef3f8; }
    body { padding: 28px; color: #172033; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .card { width: 904px; min-height: 564px; padding: 28px 32px; background: #fff; border: 1px solid #cdd8e5; border-radius: 16px; box-shadow: 0 12px 28px rgba(25, 55, 90, .12); }
    .eyebrow { color: #55708d; font-size: 16px; letter-spacing: 1px; }
    .header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-top: 8px; }
    h1 { margin: 0; font-size: 32px; line-height: 1.3; }
    .badge { flex: none; padding: 8px 18px; color: #087443; background: #daf6e7; border: 1px solid #9cddbb; border-radius: 999px; font-size: 20px; font-weight: 700; }
    .requirement { margin-top: 22px; padding: 14px 18px; background: #f5f8fc; border-left: 5px solid #2f6fb2; border-radius: 8px; font-size: 20px; }
    .requirement b { color: #1f5c9d; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .metric { padding: 15px 16px; background: #f8fbfd; border: 1px solid #d8e2ec; border-radius: 10px; }
    .metric span { display: block; color: #60758d; font-size: 14px; }
    .metric strong { display: block; margin-top: 6px; color: #0b7f55; font-size: 25px; }
    .method { margin-top: 18px; color: #34445a; font-size: 17px; line-height: 1.65; }
    .visual { margin-top: 18px; min-height: 120px; padding: 18px; border: 1px solid #dce5ef; border-radius: 12px; background: linear-gradient(180deg, #fbfdff, #f4f8fc); }
    .barrow { display: grid; grid-template-columns: 100px 1fr 90px; gap: 12px; align-items: center; margin: 10px 0; font-size: 15px; }
    .bar { height: 17px; background: #dce6f0; border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #1f9b68, #57c890); }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .day { padding: 13px 4px; text-align: center; color: #096d45; background: #dff7e9; border: 1px solid #a4dfbe; border-radius: 9px; font-weight: 700; }
    .timeline { position: relative; height: 80px; margin: 10px 12px 0; }
    .timeline:before { content: ""; position: absolute; left: 0; right: 0; top: 30px; height: 10px; border-radius: 10px; background: linear-gradient(90deg, #39b579 0 66.66%, #135ea8 66.66% 100%); }
    .mark { position: absolute; top: 50px; transform: translateX(-50%); font-size: 14px; color: #50647a; }
    .mark:before { content: ""; position: absolute; left: 50%; top: -25px; width: 2px; height: 20px; background: #50647a; }
    .timeline .mark:first-child { transform: none; }
    .timeline .mark:first-child:before { left: 0; }
    .timeline .mark:last-child { transform: translateX(-100%); white-space: nowrap; text-align: right; }
    .timeline .mark:last-child:before { left: 100%; }
    .foot { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 14px; border-top: 1px solid #d9e2ec; color: #51677f; font-size: 14px; }
    .foot b { color: #203349; }
  </style>
</head>
<body>
  <main class="card" id="card"></main>
  <script>
    const items = {
      T01: {
        title: '系统响应时间', req: '≤ 3 秒', evidence: 'PERF-T01-20260715',
        method: '登录、设备列表、地图首页、航线列表、任务列表各采样 20 次，共 100 次，统计平均值、P95 和最大值。',
        metrics: [['平均值','0.84 秒'],['P95','1.47 秒'],['最大值','2.18 秒']],
        bars: [['平均值',28,'0.84 s'],['P95',49,'1.47 s'],['最大值',73,'2.18 s']]
      },
      T02: {
        title: '数据传输延迟', req: '≤ 50 ms', evidence: 'NET-T02-20260715',
        method: '在同一千兆局域网内采集设备上报与平台接收时间戳 1000 组，并用 Wireshark 复核端到端延迟。',
        metrics: [['平均值','28.6 ms'],['P95','41.8 ms'],['最大值','47.3 ms']],
        bars: [['平均值',57,'28.6 ms'],['P95',84,'41.8 ms'],['最大值',95,'47.3 ms']]
      },
      T03: {
        title: '系统并发用户数', req: '≥ 50', evidence: 'PERF-T03-20260715',
        method: 'JMeter 按 10、30、50、60 并发阶梯执行登录、列表查询和地图数据请求，每档持续 10 分钟。',
        metrics: [['稳定并发','60'],['累计请求','18,240 次'],['成功率','99.98%']],
        bars: [['验收要求',83,'50 并发'],['实测能力',100,'60 并发'],['P95 响应',59,'1.76 s']]
      },
      T04: {
        title: '系统稳定性', req: '7 × 24 小时无故障运行', evidence: 'STAB-T04-20260715',
        method: '连续运行 168 小时，每小时检查健康状态、错误日志、CPU、内存、磁盘、数据库连接和设备在线状态。',
        metrics: [['连续运行','168 小时'],['异常重启','0 次'],['服务可用率','100%']],
        days: ['第1天','第2天','第3天','第4天','第5天','第6天','第7天']
      },
      T05: {
        title: '历史数据记录', req: '至少保存一个月', evidence: 'DATA-T05-20260715',
        method: '按设备、任务和时间范围核验 2026-06-01 至 2026-07-15 数据，并抽查页面与数据库记录。',
        metrics: [['可查询范围','45 天'],['抽查记录','100 条'],['追溯结果','完整']],
        timeline: true
      }
    };
    const key = new URLSearchParams(location.search).get('item') || 'T01';
    const x = items[key];
    const metrics = x.metrics.map(m => `<div class="metric"><span>${m[0]}</span><strong>${m[1]}</strong></div>`).join('');
    let visual = '';
    if (x.bars) visual = x.bars.map(b => `<div class="barrow"><span>${b[0]}</span><div class="bar"><i style="width:${b[1]}%"></i></div><b>${b[2]}</b></div>`).join('');
    if (x.days) visual = `<div class="days">${x.days.map(d => `<div class="day">${d}<br>正常</div>`).join('')}</div>`;
    if (x.timeline) visual = `<div class="timeline"><span class="mark" style="left:0%">2026-06-01</span><span class="mark" style="left:66.66%">30 天要求</span><span class="mark" style="left:100%">45 天实测</span></div>`;
    document.querySelector('#card').innerHTML = `
      <div class="eyebrow">无人机综合管理平台 · 项目验收测试记录摘录</div>
      <div class="header"><h1>${key.replace('T0','T-0')} ${x.title}</h1><div class="badge">通过</div></div>
      <div class="requirement">技术参数要求：<b>${x.req}</b></div>
      <div class="metrics">${metrics}</div>
      <div class="method"><b>测试方法：</b>${x.method}</div>
      <div class="visual">${visual}</div>
      <div class="foot"><span>测试日期：2026 年 7 月 15 日</span><span>证据编号：<b>${x.evidence}</b></span></div>`;
  </script>
</body>
</html>
